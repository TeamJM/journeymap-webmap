plugins {
    // 1.12.2 webmap is FORGE-ONLY. ForgeGradle 7 (the FG7 legacy-Forge mavenizer, applied in
    // common/build.gradle and forge/build.gradle) puts MCP-mapped Minecraft on the compile classpath;
    // the renamer, shadow and publishing plugins are declared in the forge module that uses them. The
    // 1.16.5 webmap's fabric-loom / minivan / tiny-remapper mojmap toolchain is gone - on 1.12.2 the JM
    // internals jar is MCP and resolves directly against webmap's own MCP classpath (no remap).
}

configurations.configureEach {
    // Check for snapshots more frequently than Gradle's default of 1 day. 0 = every build.
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

tasks.configureEach { task ->
    if (task instanceof Copy || task instanceof AbstractArchiveTask) {
        task.duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}
