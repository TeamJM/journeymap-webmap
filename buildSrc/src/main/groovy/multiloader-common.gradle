plugins {
    id 'java-library'
    id 'java'
    id 'idea'
}

// Per-loader archive name: journeymap-webmap-common / -forge.
base {
    archivesName = "${project.base_name}-${project.name}"
}
version = "${project.minecraft_version}-${project.mod_version}"
group = project.group_id

// LESSON FROM THE 1.16.5 PORT (and the 1.12.2 mod): a jdk-8 toolchain launcher is UNRELIABLE for
// enforcing the Java-8 API surface - a forked jdk-8 javac still resolves symbols against whatever JRE it
// actually runs on, so post-8 API calls (List.of / Stream.toList) slip through compilation and
// NoSuchMethodError at runtime on MC 1.12.2's real Java-8 JRE. Compile with the Gradle daemon's own
// (modern) javac under --release 8 instead - ct.sym then enforces the exact Java-8 API at compile time.
tasks.withType(JavaCompile).configureEach {
    options.release = java_version.toInteger()
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'JourneyMap (Public)'
        url = 'https://jm.gserv.me/repository/maven-public/'
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // cursemaven - the JourneyMap mod internals jar (curse.maven:journeymap-32274:<fileid>) webmap serves
    // over HTTP is published ONLY to CurseForge (unlike the addon API, which is on BlameJared/mavenLocal).
    maven {
        url 'https://www.cursemaven.com'
    }
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation group: 'org.jetbrains', name: 'annotations', version: '23.0.0'

    // The JourneyMap mod internals (journeymap.client.* / journeymap.common.*) webmap serves over HTTP.
    // On 1.12.2 (forge-only, MCP) the SAME MCP cursemaven jar satisfies BOTH modules, so it is declared
    // here in the shared convention rather than per-module (the 1.16.5 webmap needed different mojmap vs
    // MCP jars per loader). Its JM signatures expose MCP-named Minecraft types that resolve directly
    // against each module's own forge MCP compile classpath (declared in common/forge build.gradle).
    // transitive = false: the curse POM must not drag JM's own runtime deps onto the compile classpath.
    // compileOnly - provided by the installed journeymap at runtime, never bundled. Both :common and
    // :forge apply this convention, so both get it on their own compileClasspath (the injected common
    // source compiled into :forge does not inherit :common's deps through the project(':common') seam).
    compileOnly("curse.maven:journeymap-32274:${project.journeymap_forge_version}") { transitive = false }

    // The public JourneyMap API (common variant). compileOnly - provided by the installed journeymap.
    compileOnly group: 'info.journeymap', name: 'journeymap-api-common', version: project.journeymap_api_version, changing: true

    // Compile access to the bundled libraries on EVERY module (loaders do not inherit common's
    // implementation deps through the compileOnly project(':common') seam - each applies this convention
    // and so gets them directly). Actual BUNDLING is added in forge/build.gradle via `shade` + relocate.
    // The web frontend (webmap-client) and Javalin (+kotlin-stdlib, since Javalin is Kotlin) are the
    // payload; slf4j is pinned so Javalin/Jetty's logging resolves consistently.
    implementation group: 'info.journeymap', name: 'webmap-client', version: project.journeymap_webmap_version, changing: true
    implementation group: 'io.javalin', name: 'javalin', version: project.javalin_version
    implementation group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: '2.1.20'
    implementation enforcedPlatform('org.slf4j:slf4j-api:2.0.16')
}

jar {
    dependsOn 'processDocs'
    manifest {
        attributes([
                'Specification-Title'     : project.name,
                'Specification-Vendor'    : project.group_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : "${version}",
                'Implementation-Vendor'   : project.group_id,
                'Implementation-URL'      : 'http://journeymap.info',
                'Implementation-Timestamp': getDate()
        ])
    }
}

tasks.register('processDocs', Copy) {
    def loader
    def loaderVersion
    if ('forge'.equalsIgnoreCase(project.name)) {
        loaderVersion = forge_version
        loader = 'Forge'
    } else {
        loaderVersion = '1.0.0'
        loader = 'Common'
    }
    from(file("$rootDir/doc/")) {
        include '*.html'
        expand 'version': project.mod_version,
                'date': getDate(),
                'mcversion': project.minecraft_version,
                'loaderversion': loaderVersion,
                'loadername': loader
    }
    into "${layout.buildDirectory.get()}/doc"
}

processResources {
    // Resource placeholders used by the manifests. On 1.12.2 (forge-only) the mod manifest is mcmod.info;
    // mods.toml is still expanded harmlessly if present. pack.mcmeta has no placeholders. All version
    // placeholders resolve to the bare mod version (not the mc-prefixed gradle version).
    var expandProps = [
            version   : project.mod_version,
            modVersion: project.mod_version,
            date      : getDate()
    ]
    filesMatching(['META-INF/mods.toml', 'mcmod.info']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

def getDate() {
    def date = new Date()
    return date.format(project.dateFormat)
}
