plugins {
    id 'java-library'
    id 'maven-publish'
//    id 'org.jetbrains.kotlin.jvm'
    id 'java'
}

boolean localBuild = (hasProperty("buildProfile") && "local".equals(property("buildProfile")))

base {
    archivesName = "${base_name}-${project.name}"
}

/* Artifact Version */
version = "${project.minecraft_version}-${project.mod_version}"
group = project.group_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

testing {
    suites {
        test {
            // Explicitly declare the test framework
            useJUnitJupiter() // Use useJUnit() or useTestNG() if applicable
        }
    }
}

repositories {
    mavenCentral()
    mavenLocal()
    google()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }

    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        name = "JourneyMap (Public)"
        url = "https://jm.gserv.me/repository/maven-public/"
    }

}

def journeymapCurseFileId = {
    if ("fabric".equalsIgnoreCase(project.name)) {
        return project.journeymap_fabric_version
    } else if ("neoforge".equalsIgnoreCase(project.name)) {
        return project.journeymap_neoforge_version
    }
    // common and forge compile against the forge file (journeymap common code is loader-agnostic)
    return project.journeymap_forge_version
}()

dependencies {
    implementation group: 'info.journeymap', name: 'webmap-client', version: project.journeymap_webmap_version, changing: true
    compileOnly "curse.maven:journeymap-32274:${journeymapCurseFileId}"
    // for annotations
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
//    implementation("org.jetbrains.kotlin:kotlin-stdlib:2.2.21")
    // external libs
    implementation group: 'javax.servlet', name: 'javax.servlet-api', version: '4.0.1'
    implementation group: 'io.javalin', name: 'javalin', version: project.javalin_version
}
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
tasks.withType(Test) {
    failOnNoDiscoveredTests = false
}
plugins.withType(JavaPlugin) {
    dependencies {
        implementation enforcedPlatform('org.slf4j:slf4j-api:2.0.17')
    }
}
//compileKotlin {
//    source(project(":common").sourceSets.main.allSource)
//    inputs.file "../gradle.properties"
//    kotlinOptions {
//        jvmTarget = "21"
//        freeCompilerArgs += "-Xopt-in=kotlin.RequiresOptIn"
//    }
//}

jar {
    dependsOn 'processDocs'
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${base_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'     : base_name,
                'Specification-Vendor'    : "Mysticdrew",
                'Specification-Version'   : project.jar.archiveVersion,
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-URL"      : project.git_website,
                'Implementation-Vendor'   : "Mysticdrew",
                'Implementation-Timestamp': getDate(),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

tasks.register('processDocs', Copy) {
    def loader
    def loaderVersion

    if ("fabric".equalsIgnoreCase(project.name)) {
        loaderVersion = fabric_api_version
        loader = "Fabric"
    } else if ("neoforge".equalsIgnoreCase(project.name)) {
        loaderVersion = neoforge_version
        loader = "NeoForge"
    } else if ("forge".equalsIgnoreCase(project.name)) {
        loaderVersion = forge_version
        loader = "Forge"
    } else {
        loaderVersion = "1.0.0"
        loader = "Common"
    }
    // update docs
    from(file("$rootDir/doc/")) {
        include '*.html'
        expand 'version': project.mod_version,
                'date': this.getDate(),
                'mcversion': project.minecraft_version,
                'loaderversion': loaderVersion,
                'loadername': loader,
                'apiversion': project.journeymap_api_version
    }
    into "$project.buildDir/doc"
}

processResources {
    var expandProps = [
            'version'              : project.mod_version,
            'group'                : group_id, //Else we target the task's group.
            'minecraft_version'    : minecraft_version,
            'fabric_api_version'   : fabric_api_version,
            'fabric_loader_version': fabric_loader_version,
            'mod_name'             : base_name,
            'mod_author'           : "Mysticdrew",
            'mod_id'               : mod_id,
            'neoforge_version'     : neoforge_version,
            "forge_version"        : forge_version,
            'java_version'         : java_version,
            'date'                 : getDate()
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }


    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'doc/changelog.html']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

clean.doFirst {
    // Remove the Webpack bundled assets as part of the clean task
    delete "$projectDir/src/main/resources/assets/journeymap/web/"
}

def getDate() {
    def date = new Date()
    def formattedDate = date.format(project.dateFormat)
    return formattedDate
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    if (localBuild) {
        repositories {
            maven {
                url System.getenv("local_maven_url") // or `url "file://" + System.getenv("local_maven")`
            }
        }
    } else {
        repositories {
            maven {
                name = "JourneyMap"
                url = uri("https://jm.gserv.me/repository/maven-snapshots/")

                credentials {
                    username = project.findProperty("journeymap.user") ?: System.getenv("JOURNEYMAP_USER")
                    password = project.findProperty("journeymap.password") ?: System.getenv("JOURNEYMAP_PASSWORD")
                }

                version = project.version
            }
        }
    }
}
