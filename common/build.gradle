plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

// 1.20.1 Forge is SRG at runtime; the legacyForge moddev plugin compiles against mojmap + parchment.
// webmap ships no access transformer, so none is registered here.
legacyForge {
    mcpVersion = minecraft_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    // The public JourneyMap API (common variant). compileOnly - provided by the installed journeymap.
    compileOnly group: 'info.journeymap', name: 'journeymap-api-common', version: project.journeymap_api_version, changing: true
}

// Expose common's SOURCE + resources to the loader modules (they compile the source directly rather than
// depending on a common jar - see multiloader-loader). Mirrors journeymap-1.20.1.
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava(file('src/main/java'))
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
