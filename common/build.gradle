plugins {
    id 'net.minecraftforge.gradle' version '[7.0,8.0)'
    id 'multiloader-common'
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

// FG7 puts MCP-mapped Minecraft (readable class names + MCP stable_12 member names) on the compile
// classpath for the 1.7.10 forge dependency below. :common's source is recompiled into :forge, so
// Minecraft is needed at compile time only (compileOnly). No renamer on :common - only the shipped
// :forge jar is reobfuscated MCP -> SRG. The JM internals jar (from cursemaven, in the multiloader-common
// convention) is MCP too, so it resolves directly with no remap.
minecraft {
    mappings channel: project.mappings_channel, version: project.mappings
}

// Compile-vs-runtime version pins (mirrors journeymap-1.7.10). MC 1.7.10 ships guava 17.0 / commons-lang3
// 3.3.2 / gson 2.2.4; transitives (e.g. via kotlin/javalin metadata) can bump them, which would let newer
// API compile here but NoSuchMethodError on the real 1.7.10 runtime. Pin to MC's versions so the compile
// API surface matches what runs. The webmap's Data route serializes JSON with gson.
configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:17.0'
        force 'org.apache.commons:commons-lang3:3.3.2'
        force 'com.google.code.gson:gson:2.2.4'
    }
}

// The test source set (if any) references net.minecraft.* - give it the same Minecraft compile classpath
// the minecraft dependency added to main's compileOnly.
configurations {
    testCompileOnly.extendsFrom compileOnly
}

dependencies {
    compileOnly minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    // journeymap-api-common + the JM internals cursemaven jar are supplied by the multiloader-common
    // convention (compileOnly on every module), as are jsr305/annotations and the javalin/webmap-client/
    // slf4j/kotlin compile deps.
}

// Expose common's SOURCE + resources to the loader modules (they compile the source directly rather than
// depending on a common jar - see multiloader-loader). Mirrors journeymap-1.12.2.
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava(file('src/main/java'))
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
