plugins {
    id 'net.minecraftforge.gradle' version '[7.0,8.0)'
    id 'multiloader-common'
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

// FG7 puts MCP-mapped Minecraft (readable class names + MCP snapshot member names) on the compile
// classpath for the 1.12.2 forge dependency below. :common's source is recompiled into :forge, so
// Minecraft is needed at compile time only (compileOnly). No renamer on :common - only the shipped
// :forge jar is reobfuscated MCP -> SRG. This replaces the 1.16.5 minivan/mojmap toolchain: the JM
// internals jar (from cursemaven, in the multiloader-common convention) is MCP too, so it resolves
// directly with no intermediary->mojmap remap.
minecraft {
    mappings channel: project.mappings_channel, version: project.mappings
}

// The test source set (if any) references net.minecraft.* - give it the same Minecraft compile classpath
// the minecraft dependency added to main's compileOnly.
configurations {
    testCompileOnly.extendsFrom compileOnly
}

dependencies {
    compileOnly minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    // journeymap-api-common + the JM internals cursemaven jar are supplied by the multiloader-common
    // convention (compileOnly on every module), as are jsr305/annotations and the javalin/webmap-client/
    // slf4j/kotlin compile deps.
}

// Expose common's SOURCE + resources to the loader modules (they compile the source directly rather than
// depending on a common jar - see multiloader-loader). Mirrors journeymap-1.12.2.
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava(file('src/main/java'))
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
