plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'net.darkhax.curseforgegradle' version '1.1.+'
    id 'com.modrinth.minotaur' version '2.+'
    id 'maven-publish'
}

def loaderName = 'fabric'

// The convention (multiloader-common) sets a real JDK-8 toolchain, but :fabric compiles common's source,
// which imports javalin/jetty - libraries published as Java-11 bytecode (class version 55) that a JDK-8
// javac's ClassReader hard-rejects ("class file has wrong version 55.0, should be 52.0"). Compile with a
// modern javac under --release 8 instead (identical to :common): a JDK-21 javac reads the newer library
// class files while ct.sym still enforces the exact Java-8 platform API at compile time.
tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    options.release = 8
}

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
            programArg('--username=Dev')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // The fabric variant of the public API (loom remaps intermediary -> named). Not bundled.
    modCompileOnly group: 'info.journeymap', name: 'journeymap-api-fabric', version: project.journeymap_api_version, changing: true

    // The JourneyMap mod internals (journeymap.client.* / journeymap.common.*) webmap serves over HTTP,
    // pre-remapped intermediary -> mojmap (see rootProject's remapJourneymapToMojmap). Plain compileOnly
    // (not modCompileOnly): the jar is already mojmap, so loom must not re-remap it. Provided by the
    // installed journeymap at runtime, never bundled.
    compileOnly files(rootProject.journeymapMojmapJar) { builtBy rootProject.tasks.named('remapJourneymapToMojmap') }

    // Bundled payload (loom Jar-in-Jar). Compile access to these comes from the convention's
    // `implementation` deps (javalin drags the jetty stack onto the compile classpath transitively);
    // loom `include` is non-transitive, so every jar to ship is listed here explicitly.
    include group: 'info.journeymap', name: 'webmap-client', version: project.journeymap_webmap_version, changing: true
    include group: 'io.javalin', name: 'javalin', version: project.javalin_version
    include group: 'javax.servlet', name: 'javax.servlet-api', version: '4.0.1'
    include group: 'org.eclipse.jetty', name: 'jetty-server', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-webapp', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-servlet', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-security', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-http', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-io', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-util', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-util-ajax', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-xml', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty', name: 'jetty-client', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty.websocket', name: 'websocket-api', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty.websocket', name: 'websocket-common', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty.websocket', name: 'websocket-client', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty.websocket', name: 'websocket-server', version: '9.4.51.v20230217'
    include group: 'org.eclipse.jetty.websocket', name: 'websocket-servlet', version: '9.4.51.v20230217'
    include group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: '1.5.32'
    include group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-common', version: '1.5.32'
    include group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-jdk7', version: '1.5.32'
    include group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib-jdk8', version: '1.5.32'
    include group: 'org.jetbrains', name: 'annotations', version: '13.0'
    include group: 'org.slf4j', name: 'slf4j-api', version: '1.8.0-beta4'
    // slf4j 1.8.x is provider-based (ServiceLoader). javalin needs a binding, not just the api, or it
    // logs a "Missing dependency 'Slf4j simple with Provider'" banner and falls back to NOP. slf4j-simple
    // is the matching 1.8.0-beta4 provider (matches journeymap-legacy's proven Java-8 webmap setup).
    include group: 'org.slf4j', name: 'slf4j-simple', version: '1.8.0-beta4'
}

remapJar {
    archiveClassifier.set('')
}

jar {
    archiveClassifier.set('slim')
}

artifacts {
    archives remapJar
}

// Automated upload to CurseForge / Modrinth.
if (!project.hasProperty('curseForgeApiKey')) {
    ext.curseForgeApiKey = project.findProperty('curseforge_api_key') ?: 'notset'
}
if (!project.hasProperty('modrinthApiKey')) {
    ext.modrinthApiKey = project.findProperty('modrinth_api_key') ?: 'notset'
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, remapJar)
    mainFile.displayName = "${project.mod_id}-${version}+${loaderName}"
    mainFile.releaseType = release_type
    mainFile.addModLoader('Fabric', 'Quilt')
    mainFile.addJavaVersion("Java ${java_version}")
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRelation('journeymap', 'requiredDependency')
    mainFile.changelogType = 'html'
    mainFile.changelog = file("${layout.buildDirectory.get()}/doc/changelog.html")
}

tasks.modrinth.dependsOn(tasks.build)

modrinth {
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${version}+${loaderName}"
    versionName = "${project.mod_id}-${version}+${loaderName}"
    versionType = release_type
    uploadFile = remapJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ['fabric', 'quilt']
    changelog = file("${layout.buildDirectory.get()}/doc/changelog.html").exists() ? file("${layout.buildDirectory.get()}/doc/changelog.html").text : null
    dependencies {
        required.project 'journeymap'
    }
}

// Ensure build is done prior to cursegradle tasks
project.afterEvaluate {
    project.tasks.findAll { task ->
        (task.name.startsWith('curseforge') || task.name.startsWith('modrinth')) && (task.name != 'curseforge' || task.name != 'modrinth')
    }.each { projectTask -> projectTask.dependsOn build }
}

tasks.withType(PublishToMavenRepository) { task -> task.dependsOn remapJar }

publishing {
    repositories {
        maven {
            name = 'JourneyMap'
            url = uri('https://jm.gserv.me/repository/maven-releases/')
            credentials {
                username = project.findProperty('journeymap.user') ?: System.getenv('JOURNEYMAP_WEB_USER')
                password = project.findProperty('journeymap.password') ?: System.getenv('JOURNEYMAP_WEB_PASSWORD')
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version "${project.version}"
            artifact remapJar
        }
    }
}
