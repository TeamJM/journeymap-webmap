plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'net.darkhax.curseforgegradle' version '1.1.+'
    id 'com.modrinth.minotaur' version '2.+'
    id 'maven-publish'
}

def loaderName = 'fabric'

loom {
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
            programArg('--username=Dev')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run/server')
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // The fabric variant of the public API (loom remaps intermediary -> named). Not bundled.
    modCompileOnly group: 'info.journeymap', name: 'journeymap-api-fabric', version: project.journeymap_api_version, changing: true

    // Bundled payload (loom Jar-in-Jar). Compile access to these comes from the convention's
    // `implementation` deps (javalin drags the jetty stack onto the compile classpath transitively);
    // loom `include` is non-transitive, so every jar to ship is listed here explicitly.
    include group: 'info.journeymap', name: 'webmap-client', version: project.journeymap_webmap_version, changing: true
    include group: 'io.javalin', name: 'javalin', version: project.javalin_version
    include group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib', version: '2.1.20'
    include group: 'org.eclipse.jetty', name: 'jetty-server', version: '11.0.20'
    include group: 'org.eclipse.jetty', name: 'jetty-servlet', version: '11.0.20'
    include group: 'org.eclipse.jetty', name: 'jetty-webapp', version: '11.0.20'
    include group: 'org.eclipse.jetty', name: 'jetty-security', version: '11.0.20'
    include group: 'org.eclipse.jetty', name: 'jetty-io', version: '11.0.20'
    include group: 'org.eclipse.jetty', name: 'jetty-http', version: '11.0.20'
    include group: 'org.eclipse.jetty', name: 'jetty-util', version: '11.0.20'
    include group: 'org.eclipse.jetty', name: 'jetty-xml', version: '11.0.20'
    include group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'
    include group: 'org.eclipse.jetty.toolchain', name: 'jetty-jakarta-servlet-api', version: '5.0.2'
}

remapJar {
    archiveClassifier.set('')
}

jar {
    archiveClassifier.set('slim')
}

artifacts {
    archives remapJar
}

// Automated upload to CurseForge / Modrinth.
if (!project.hasProperty('curseForgeApiKey')) {
    ext.curseForgeApiKey = project.findProperty('curseforge_api_key') ?: 'notset'
}
if (!project.hasProperty('modrinthApiKey')) {
    ext.modrinthApiKey = project.findProperty('modrinth_api_key') ?: 'notset'
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, remapJar)
    mainFile.displayName = "${project.mod_id}-${version}+${loaderName}"
    mainFile.releaseType = release_type
    mainFile.addModLoader('Fabric', 'Quilt')
    mainFile.addJavaVersion("Java ${java_version}")
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRelation('journeymap', 'requiredDependency')
    mainFile.addEnvironment("Client")
    mainFile.changelogType = 'html'
    mainFile.changelog = file("${layout.buildDirectory.get()}/doc/changelog.html")
}

tasks.modrinth.dependsOn(tasks.build)

modrinth {
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${version}+${loaderName}"
    versionName = "${project.mod_id}-${version}+${loaderName}"
    versionType = release_type
    uploadFile = remapJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ['fabric', 'quilt']
    changelog = file("${layout.buildDirectory.get()}/doc/changelog.html").exists() ? file("${layout.buildDirectory.get()}/doc/changelog.html").text : null
    dependencies {
        required.project 'journeymap'
    }
}

// Ensure build is done prior to cursegradle tasks
project.afterEvaluate {
    project.tasks.findAll { task ->
        (task.name.startsWith('curseforge') || task.name.startsWith('modrinth')) && (task.name != 'curseforge' || task.name != 'modrinth')
    }.each { projectTask -> projectTask.dependsOn build }
}

tasks.withType(PublishToMavenRepository) { task -> task.dependsOn remapJar }

publishing {
    repositories {
        maven {
            name = 'JourneyMap'
            url = uri('https://jm.gserv.me/repository/maven-releases/')
            credentials {
                username = project.findProperty('journeymap.user') ?: System.getenv('JOURNEYMAP_WEB_USER')
                password = project.findProperty('journeymap.password') ?: System.getenv('JOURNEYMAP_WEB_PASSWORD')
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version "${project.version}"
            artifact remapJar
        }
    }
}
