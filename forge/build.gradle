import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0,8.0)'
    // legacy-Forge reobf MCP -> SRG for the shipped jar (Forge 1.7.10's SRG runtime). Same mechanism the
    // journeymap-1.7.10 mod uses; 1.7.10 is the SIMPLE reobf case (MCP and SRG share identical class/type
    // names, only members differ), so ONE renamer.classes pass suffices - NO ART, NO mojmap remap.
    id 'net.minecraftforge.renamer' version '1.1.0'
    id 'com.gradleup.shadow' version '8.3.10'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id 'com.modrinth.minotaur' version '2.+'
    id 'maven-publish'
}

def loaderName = 'forge'

configurations {
    // Libraries bundled into the shipped fat jar via shadowJar. shade resolves transitively, so
    // `shade javalin` pulls the jetty stack + kotlin-stdlib; the relocations below move them out of the way.
    shade
}

// Compile-vs-runtime version pins (mirrors journeymap-1.7.10). MC 1.7.10 ships log4j 2.0-beta9, guava 17.0,
// commons-lang3 3.3.2, gson 2.2.4; a transitive from the shaded stack can bump them, which would let newer
// API compile here but NoSuchMethodError/NoClassDefFoundError on the real 1.7.10 runtime. Pin to MC's
// versions so the compile API surface matches what runs. :forge recompiles :common's source (Data uses gson,
// routes use log4j), so the pins live on this module too.
configurations.all {
    resolutionStrategy {
        force 'org.apache.logging.log4j:log4j-api:2.0-beta9'
        force 'org.apache.logging.log4j:log4j-core:2.0-beta9'
        force 'com.google.guava:guava:17.0'
        force 'org.apache.commons:commons-lang3:3.3.2'
        force 'com.google.code.gson:gson:2.2.4'
    }
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('client') {
            systemProperty 'journeymap.map_testing', 'true'
            workingDir.convention layout.projectDirectory.dir("run/client")
        }
        register('server') {
            args '--nogui'
            workingDir.convention layout.projectDirectory.dir("run/server")
        }
    }
}

// The 1.12.2 dev runs MUST fork a Java 8 JVM: legacy Forge's slime-launcher bootstrap
// (FG2Hacks.searchCoremods) casts the SYSTEM ClassLoader to java.net.URLClassLoader, true only on Java 8
// (Java 9+ uses the module-system AppClassLoader), so a modern-JDK run dies with a ClassCastException
// before Minecraft loads. COMPILE stays on the modern JDK + --release 8 (multiloader-common); only the run
// tasks are pinned to a Java 8 runtime, auto-detected from the installed jdk8.
def java8RunLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(8)
}
// FG7 registers runClient/runServer LAZILY, so configureEach (fires at creation) is used instead of
// tasks.named(...) at script-body time.
tasks.withType(JavaExec).matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
    javaLauncher = java8RunLauncher
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")

    // The convention (multiloader-common) already supplies compile access to the JM API, the JM internals
    // cursemaven jar, and the javalin/webmap-client/slf4j/kotlin libs on this module too, so the injected
    // :common source compiled into :forge resolves against them. Only the `shade` bundling set is declared
    // here (a separate configuration from the compile classpath).
    shade group: 'info.journeymap', name: 'webmap-client', version: project.journeymap_webmap_version, changing: true
    shade group: 'io.javalin', name: 'javalin', version: project.javalin_version
    // javalin 4.6.8 pulls slf4j-api 1.7.x transitively; pin to 1.8.0-beta4 to match the provider below
    // (slf4j 1.8.x is ServiceLoader/provider-based). Newest-wins resolution overrides javalin's 1.7.x.
    shade group: 'org.slf4j', name: 'slf4j-api', version: '1.8.0-beta4'
    // slf4j binding. NOT transitive from javalin, so declared explicitly.
    shade group: 'org.slf4j', name: 'slf4j-simple', version: '1.8.0-beta4'
}

// =====================================================================================================
// SHIPPED FAT JAR. shadowJar bundles the `shade` configuration (javalin + jetty + kotlin + slf4j +
// webmap-client) and BECOMES the distributable (empty classifier -> clean released name). The renamer
// pass below reobfuscates THIS jar's classes MCP -> SRG in place, so the clean name is preserved.
// =====================================================================================================
shadowJar {
    archiveFileName.set("${archiveBaseName.get()}-${archiveVersion.get()}.${archiveExtension.get()}")
    configurations = [project.configurations.shade]
    archiveClassifier.set("")
    // Deduplicate colliding non-class resources (first wins) so the reobf below gets a clean jar (RenameJar
    // rejects duplicate entries). The shaded jetty stack + javalin ship multiple copies of META-INF/LICENSE,
    // META-INF/NOTICE.txt and about.html, plus two different org/eclipse/jetty/http/encoding.properties.
    // Relocations already prevent any class-path collision, so only these metadata files are affected.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Drop the multi-release overlay + module-info: inert on the Java 8 LaunchWrapper runtime, and keeping
    // versioned/module class entries only risks confusing the renamer.classes reobf below.
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
    exclude 'META-INF/INDEX.LIST'
    dependencies {
        exclude("META-INF/maven/**")
        exclude("META-INF/services/org.*")
        exclude("META-INF/services/jakarta.*")
        exclude(dependency("org.ow2.asm:.*:.*"))
    }
    // NO minimize: javalin/jetty load many classes reflectively/by-name (Javalin 4 eagerly instantiates
    // org.eclipse.jetty.websocket.server.WebSocketServerFactory on start; jetty resolves connection
    // factories, the slf4j provider, etc. via ServiceLoader/reflection). minimize would prune them and the
    // server fails to bind. Ship the shaded libs whole.
    relocate "kotlin", "info.journeymap.shaded.kotlin.kotlin"
    relocate "jakarta", "info.journeymap.shaded.jakarta"
    relocate "javax.servlet", "info.journeymap.shaded.org.javax.servlet"
    relocate "org.intellij", "info.journeymap.shaded.org.intellij"
    relocate "org.jetbrains", "info.journeymap.shaded.org.jetbrains"
    relocate "org.slf4j", "info.journeymap.shaded.org.slf4j"
    relocate "org.eclipse", "info.journeymap.shaded.org.eclipse"
    relocate "io.javalin", "info.journeymap.shaded.io.javalin"

    exclude 'dummyThing'
    exclude 'LICENSE.txt'
}

// =====================================================================================================
// MCP -> SRG mapping feed for the shipped-jar reobf. FG7's mavenizer materializes the MCP<->SRG map as a
// gzipped tsrg2 (map2srg: left = MCP human names, right = func_/field_ SRG) under the ROOT project's
// .gradle. RenameJar wants a single plain (gunzipped) .tsrg, so gunzip it into build/. Glob the
// mappings_${channel} dir so the build timestamp is not hardcoded (exactly one map2srg for this MC + mappings).
// =====================================================================================================
def map2srgTsrg = layout.buildDirectory.file('reobf-mappings/map2srg.tsrg')
def gunzipMap2Srg = tasks.register('gunzipMap2Srg') {
    description = 'Gunzips the FG7 mavenizer MCP->SRG map2srg.tsrg.gz into build/ as a plain .tsrg for the shipped-jar reobf.'
    outputs.file map2srgTsrg
    doLast {
        def mappingsDir = rootProject.layout.projectDirectory
                .dir(".gradle/mavenizer/repo/net/minecraft/mappings_${project.mappings_channel}").asFile
        def gz = fileTree(mappingsDir) { include '**/*-map2srg.tsrg.gz' }.files
        if (gz.size() != 1)
        {
            throw new GradleException("gunzipMap2Srg: expected exactly one *-map2srg.tsrg.gz under ${mappingsDir} " +
                    "(has the FG7 mavenizer materialized? run :forge:assemble once); found ${gz.size()}: ${gz*.name}")
        }
        def out = map2srgTsrg.get().asFile
        out.parentFile.mkdirs()
        gz.first().withInputStream { i ->
            new java.util.zip.GZIPInputStream(i).withCloseable { g ->
                out.withOutputStream { o -> o << g }
            }
        }
        logger.lifecycle("gunzipMap2Srg: ${gz.first().name} -> ${out.name} (${out.length()} bytes, MCP->SRG tsrg2)")
    }
}

// The authoritative renamer.mappings feed = the single gunzipped map2srg (reverse stays default false =
// MCP-left -> SRG-right). Passing the TaskProvider carries the task dependency so the reobf auto-runs
// after gunzip. webmap has NO mixins, so there is no refmap/@Shadow partition - renamer.classes below
// auto-seeds its map straight from renamer.mappings.
renamer.mappings.setFrom(gunzipMap2Srg)

// =====================================================================================================
// REOBF the shipped shadowJar MCP -> SRG IN PLACE (over its own clean-named archiveFile - HARD RULE: never
// an -srg classifier). 1.7.10 is the SIMPLE reobf case: MCP and SRG share identical class/type names
// (net.minecraft.*), so no descriptor carries a renamed type and ONE plain renamer.classes pass reobfs
// correctly. Only webmap's own journeymap_webmap.* classes carry MC references; the relocated shaded libs
// reference no MC types and pass through untouched. accessTransformers = false: webmap ships no AT.
// =====================================================================================================
def reobfShadowJar = renamer.classes(tasks.named('shadowJar')) {
    accessTransformers = false
    output = tasks.named('shadowJar').flatMap { it.archiveFile }
}

// Wire into the build. reobfShadowJar reads shadowJar's archiveFile, so it dependsOn shadowJar. finalizedBy
// makes a bare `:forge:shadowJar` reobf too; assemble dependsOn reobfShadowJar makes the reobf'd SRG jar
// the artifact of assemble/build. Order publish/curseforge/modrinth after the reobf so they never read the
// raw MCP jar.
tasks.named('shadowJar').configure { finalizedBy reobfShadowJar }
tasks.named('assemble').configure { dependsOn reobfShadowJar }
tasks.matching { it.name.startsWith('publish') || it.name.startsWith('modrinth') || it.name.startsWith('curseforge') }.configureEach {
    mustRunAfter reobfShadowJar
}

jar.finalizedBy 'shadowJar'

jar {
    archiveClassifier.set('slim')
    manifest {
        attributes([
                "Specification-Title"     : project.name,
                "Specification-Vendor"    : project.group_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : project.group_id,
                "Implementation-URL"      : "http://journeymap.info"
        ])
    }
}

artifacts {
    archives shadowJar
}

// Automated upload to CurseForge / Modrinth.
if (!project.hasProperty("curseForgeApiKey")) {
    ext.curseForgeApiKey = project.findProperty("curseforge_api_key") ?: "notset"
}
if (!project.hasProperty("modrinthApiKey")) {
    ext.modrinthApiKey = project.findProperty("modrinth_api_key") ?: "notset"
}

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, shadowJar)
    mainFile.displayName = "${project.mod_id}-${version}+${loaderName}"
    mainFile.releaseType = release_type
    mainFile.addModLoader("Forge")
    mainFile.addJavaVersion("Java ${java_version}")
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRelation("journeymap", "requiredDependency")
    mainFile.changelogType = "html"
    mainFile.changelog = file("${layout.buildDirectory.get()}/doc/changelog.html")
}

tasks.modrinth.dependsOn(tasks.build)

modrinth {
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${version}-forge"
    versionName = "${project.mod_id}-${version}+${loaderName}"
    versionType = release_type
    uploadFile = shadowJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["forge"]
    changelog = file("${layout.buildDirectory.get()}/doc/changelog.html").exists() ? file("${layout.buildDirectory.get()}/doc/changelog.html").text : null
    dependencies {
        required.project "journeymap"
    }
}

// Ensure build is done prior to cursegradle tasks
project.afterEvaluate {
    project.tasks.findAll { task ->
        (task.name.startsWith('curseforge') || task.name.startsWith('modrinth')) && (task.name != 'curseforge' || task.name != 'modrinth')
    }.each { projectTask -> projectTask.dependsOn build }
}

tasks.withType(PublishToMavenRepository) { task -> task.dependsOn shadowJar }

publishing {
    repositories {
        maven {
            name = "JourneyMap"
            url = uri("https://jm.gserv.me/repository/maven-releases/")
            credentials {
                username = project.findProperty("journeymap.user") ?: System.getenv("JOURNEYMAP_WEB_USER")
                password = project.findProperty("journeymap.password") ?: System.getenv("JOURNEYMAP_WEB_PASSWORD")
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version "${project.version}-forge"
            artifact shadowJar
        }
    }
}
