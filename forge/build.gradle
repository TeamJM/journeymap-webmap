import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.2,8.0)'
    id 'com.gradleup.shadow' version '9.0.0'
    // Reobfuscates the shipped jar (classes) to SRG names - required for Forge 1.20.1's SRG runtime.
    // FG7 compiles webmap against MOJMAP; the installed forge maps net.minecraft.* members to SRG at runtime.
    id 'net.minecraftforge.renamer' version '1.1.0'
    id 'net.darkhax.curseforgegradle' version '1.1.+'
    id 'com.modrinth.minotaur' version '2.+'
    id 'maven-publish'
}

def loaderName = 'forge'

configurations {
    shade
}

repositories {
    // ForgeGradle 7 no longer auto-injects these; required for the Minecraft/Forge classpath.
    exclusiveContent {
        forRepository { maven minecraft.mavenizer }
        filter {
            includeGroupAndSubgroups('net.minecraft')
            includeModule('net.minecraftforge', 'forge')
        }
    }
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    implementation("net.sf.jopt-simple:jopt-simple:5.0.4") { version { strictly "5.0.4" } }

    // The forge variant of the public API. Provided by the installed journeymap at runtime; not bundled.
    compileOnly group: 'info.journeymap', name: 'journeymap-api-forge', version: project.journeymap_api_version, changing: true

    // Bundled payload (shadowJar over the `shade` config). shade resolves transitively, so `shade javalin`
    // pulls the jetty stack + kotlin-stdlib into the fat jar; the relocations below move them out of the
    // way. Compile access comes from the convention's `implementation` deps.
    shade group: 'info.journeymap', name: 'webmap-client', version: project.journeymap_webmap_version, changing: true
    shade group: 'io.javalin', name: 'javalin', version: project.javalin_version
    shade group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.16'
}

minecraft {
    mappings channel: 'official', version: "${project.minecraft_version}"

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('client') {
            systemProperty 'journeymap.map_testing', 'true'
            workingDir.convention layout.projectDirectory.dir("run/client")
        }
        register('server') {
            args 'nogui'
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            workingDir.convention layout.projectDirectory.dir("run/server")
        }
    }
}

// Reobfuscate the shipped fat (shadow) jar to SRG names for Forge 1.20.1's SRG runtime. FG7 compiles
// webmap's net.minecraft.* references as MOJMAP; the runtime resolves them as SRG. Only webmap's own
// classes carry MC references - the shaded (relocated) libraries have none, so they pass through untouched.
// NOTE: must come AFTER the dependencies block - minecraft.dependency.toSrgFile requires
// minecraft.dependency(...) to be declared first, else FG7 fails config with "Mavenizer instance not found".
renamer.mappings.from minecraft.dependency.toSrgFile

// Reobf the shadowJar IN PLACE (overwrite its own output) so the distributable keeps the clean released
// name. renamer.classes() auto-seeds its single map from the global renamer.mappings (toSrgFile above).
def reobfJar = renamer.classes(tasks.named('shadowJar')) {
    accessTransformers = false
    output = tasks.named('shadowJar').flatMap { it.archiveFile }
}

// Shadow re-asserts `Multi-Release: true` in the manifest regardless of the shadowJar manifest block, and
// the reobf drops the versioned overlay - so strip the attribute from the finished jar here, after reobf
// has written it, to avoid securejarhandler's `NoSuchFileException: /META-INF/versions` at mod discovery.
reobfJar.configure {
    doLast {
        def jarPath = tasks.named('shadowJar').get().archiveFile.get().asFile.toPath()
        def uri = java.net.URI.create("jar:" + jarPath.toUri())
        java.nio.file.FileSystems.newFileSystem(uri, [:]).withCloseable { fs ->
            def mf = fs.getPath("META-INF/MANIFEST.MF")
            def kept = java.nio.file.Files.readAllLines(mf).findAll { !it.toLowerCase().startsWith("multi-release") }
            java.nio.file.Files.write(mf, kept)
        }
    }
}

tasks.named('shadowJar').configure {
    finalizedBy reobfJar
}

// The reobf overwrites the shadowJar output in place, so upload/publish tasks reading it must run after.
tasks.matching { it.name.startsWith('publish') || it.name.startsWith('modrinth') || it.name.startsWith('curseforge') }.configureEach {
    mustRunAfter reobfJar
}

shadowJar {
    archiveFileName.set("${archiveBaseName.get()}-${archiveVersion.get()}.${archiveExtension.get()}")
    configurations = [project.configurations.shade]
    archiveClassifier.set("")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Some shaded libs (jetty, kotlin-stdlib, slf4j) are multi-release jars. Shadow merges their
    // `Multi-Release: true` manifest attr into the fat jar and re-asserts it over any manifest block, but
    // the SRG reobf step below drops the META-INF/versions/ overlay - leaving a manifest that claims MR
    // with no versions dir, which makes Forge 1.20.1's securejarhandler throw
    // `NoSuchFileException: /META-INF/versions` at mod discovery. Drop the overlay here (base classes are
    // correct on the Java 17 runtime); the leftover Multi-Release attr is stripped after reobf (below).
    exclude 'META-INF/versions/**'
    dependencies {
        exclude("META-INF/maven/**")
        exclude("META-INF/services/org.*")
        exclude("META-INF/services/jakarta.*")
        exclude(dependency("org.ow2.asm:.*:.*"))
    }
    minimize {
        // API/frontend have utility classes reached only reflectively; keep them.
        exclude(dependency("info.journeymap:.*:.*"))
        exclude(dependency("org.slf4j:.*:.*"))
    }
    relocate "kotlin", "info.journeymap.shaded.kotlin.kotlin"
    relocate "jakarta", "info.journeymap.shaded.jakarta"
    relocate "javax.servlet", "info.journeymap.shaded.org.javax.servlet"
    relocate "org.intellij", "info.journeymap.shaded.org.intellij"
    relocate "org.jetbrains", "info.journeymap.shaded.org.jetbrains"
    relocate "org.slf4j", "info.journeymap.shaded.org.slf4j"
    relocate "org.eclipse", "info.journeymap.shaded.org.eclipse"
    relocate "io.javalin", "info.journeymap.shaded.io.javalin"

    exclude 'dummyThing'
    exclude 'LICENSE.txt'
}

tasks.assemble.dependsOn shadowJar
jar.finalizedBy 'shadowJar'

jar {
    archiveClassifier.set('slim')
    manifest {
        attributes([
                "Specification-Title"     : project.name,
                "Specification-Vendor"    : project.group_id,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : project.group_id,
                "Implementation-URL"      : "http://journeymap.info"
        ])
    }
}

artifacts {
    archives shadowJar
}

// Automated upload to CurseForge / Modrinth.
if (!project.hasProperty("curseForgeApiKey")) {
    ext.curseForgeApiKey = project.findProperty("curseforge_api_key") ?: "notset"
}
if (!project.hasProperty("modrinthApiKey")) {
    ext.modrinthApiKey = project.findProperty("modrinth_api_key") ?: "notset"
}

tasks.register("publishCurseForge", TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, shadowJar)
    mainFile.displayName = "${project.mod_id}-${version}+${loaderName}"
    mainFile.releaseType = release_type
    mainFile.addModLoader("Forge")
    mainFile.addJavaVersion("Java ${java_version}")
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.addRelation("journeymap", "requiredDependency")
    mainFile.changelogType = "html"
    mainFile.changelog = file("${layout.buildDirectory.get()}/doc/changelog.html")
}

tasks.modrinth.dependsOn(tasks.build)

modrinth {
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${version}-forge"
    versionName = "${project.mod_id}-${version}+${loaderName}"
    versionType = release_type
    uploadFile = shadowJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["forge"]
    changelog = file("${layout.buildDirectory.get()}/doc/changelog.html").exists() ? file("${layout.buildDirectory.get()}/doc/changelog.html").text : null
    dependencies {
        required.project "journeymap"
    }
}

// Ensure build is done prior to cursegradle tasks
project.afterEvaluate {
    project.tasks.findAll { task ->
        (task.name.startsWith('curseforge') || task.name.startsWith('modrinth')) && (task.name != 'curseforge' || task.name != 'modrinth')
    }.each { projectTask -> projectTask.dependsOn build }
}

tasks.withType(PublishToMavenRepository) { task -> task.dependsOn shadowJar }

publishing {
    repositories {
        maven {
            name = "JourneyMap"
            url = uri("https://jm.gserv.me/repository/maven-releases/")
            credentials {
                username = project.findProperty("journeymap.user") ?: System.getenv("JOURNEYMAP_WEB_USER")
                password = project.findProperty("journeymap.password") ?: System.getenv("JOURNEYMAP_WEB_PASSWORD")
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId base.archivesName.get()
            version "${project.version}-forge"
            artifact shadowJar
        }
    }
}
