mod_version=1.0.11
minecraft_version=1.7.10

journeymap_webmap_version=1.1-SNAPSHOT
journeymap_api_version=1.7.10-2.0.0
group_id=info.journeymap_webmap
name=JourneyMap WebMap
mod_id=journeymap_webmap
base_name=journeymap-webmap

# 1.7.10 = Java 8
java_version=8

release_type=release

# Forge - MCP stable_12 (matches journeymap-1.7.10 so the JM internals webmap serves resolve 1:1).
# Compile with a modern JDK under --release 8 (see buildSrc/multiloader-common.gradle); no jdk-8 toolchain.
mappings_channel=stable
mappings=12-1.7.10
# NOTE: the 1.7.10 forge maven artifact carries a trailing -1.7.10 (full coordinate
# net.minecraftforge:forge:1.7.10-10.13.4.1614-1.7.10). The build composes ${minecraft_version}-${forge_version},
# so the suffix lives here (matches journeymap-1.7.10 + journeymap-api's 1.7.10 branch).
forge_version=10.13.4.1614-1.7.10

# curse file id for journeymap 1.7.10 (6.x). webmap compiles against journeymap.client.* / journeymap.common.*
# internals via cursemaven (curse.maven:journeymap-32274:<fileid>). The 1.7.10 JM build is forge/MCP, so its
# JM method signatures expose MCP-named 1.7.10 Minecraft types that resolve DIRECTLY against webmap's own MCP
# forge classpath - no remap. compileOnly - provided by the installed journeymap at runtime; webmap's shipped
# jar is reobf'd MCP->SRG like JM's own. Forge-only, so a single id (no journeymap_fabric_version).
journeymap_forge_version=8426210

javalin_version=4.6.8

curseforge_project_id=793035
modrinth_project_id=YaZ1fUTg

# Gradle
dateFormat=yyyy-MM-dd-HH:mm:ss
org.gradle.jvmargs=-Xms1G -Xmx3G -Dnojline/
org.gradle.daemon=true
