# 1.16.5 = Java 8
java_version=8

# Parchment mappings - retained for reference. :common now compiles against plain mojmap via minivan
# (no parchment); these are not consumed by any module on 1.16.5.
parchment_minecraft=1.20.1
parchment_version=2023.09.03

release_type=release

# Forge
mappings_channel=official
forge_version=36.2.22
# curse file ids for journeymap 1.16.5 (6.x) - webmap compiles against journeymap.client.* internals via
# cursemaven (curse.maven:journeymap-32274:<fileid>). compileOnly, so no remap/bundle needed.
journeymap_forge_version=8379079

# mcp_config build for 1.16.5 - source of joined.tsrg (obf->srg) used by the forge compile remap.
# The FG7 forge userdev jar ships SRG-period MC class names; the remap rewrites them to modern-mojmap
# (matching the minivan-mapped :common) using joined.tsrg + Mojang official client mappings, and the
# inverse composes the modern-mojmap -> SRG map that reobfs the shipped jar for Forge's SRG runtime.
mcp_config_version=1.16.5-20210115.111550
# Mojang official 1.16.5 client mappings (proguard, obf<->modern). Immutable content-addressed URL.
mojang_client_mappings_url=https://piston-data.mojang.com/v1/objects/374c6b789574afbdc901371207155661e0509e17/client.txt
mojang_client_mappings_sha1=374c6b789574afbdc901371207155661e0509e17

