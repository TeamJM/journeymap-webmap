mod_version=1.0.11
minecraft_version=1.12.2

journeymap_webmap_version=1.1-SNAPSHOT
journeymap_api_version=1.12.2-2.0.0
group_id=info.journeymap_webmap
name=JourneyMap WebMap
mod_id=journeymap_webmap
base_name=journeymap-webmap

# 1.12.2 = Java 8
java_version=8

release_type=release

# Forge - MCP snapshot_20171003 (matches journeymap-1.12.2 so the JM internals webmap serves resolve 1:1).
# Compile with a modern JDK under --release 8 (see buildSrc/multiloader-common.gradle); no jdk-8 toolchain.
mappings_channel=snapshot
mappings=20171003-1.12
forge_version=14.23.5.2860

# curse file id for journeymap 1.12.2 (6.x). webmap compiles against journeymap.client.* / journeymap.common.*
# internals via cursemaven (curse.maven:journeymap-32274:<fileid>). The 1.12.2 JM build is forge/MCP, so its
# JM method signatures expose MCP-named Minecraft types (net.minecraft.util.math.BlockPos,
# net.minecraft.util.ResourceLocation, ...) that resolve DIRECTLY against webmap's own MCP forge classpath -
# NO intermediary->mojmap remap (the whole reason the 1.16.5 webmap needed minivan/loom/tiny-remapper).
# compileOnly - provided by the installed journeymap at runtime; webmap's shipped jar is reobf'd MCP->SRG
# like JM's own. Forge-only on 1.12.2, so there is a single id (no journeymap_fabric_version).
journeymap_forge_version=8415986

javalin_version=4.6.8

curseforge_project_id=793035
modrinth_project_id=YaZ1fUTg

# Gradle
dateFormat=yyyy-MM-dd-HH:mm:ss
org.gradle.jvmargs=-Xms1G -Xmx3G -Dnojline/
org.gradle.daemon=true
